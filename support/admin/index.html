<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Обращения TopVPN</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-100"><main class="max-w-6xl mx-auto px-5 py-8"><h1 class="text-3xl font-extrabold mb-6">Поддержка TopVPN</h1><form id="login" class="max-w-md bg-white rounded-3xl p-6 space-y-3"><p class="font-bold">Ключ администратора</p><input id="key" type="password" required class="w-full h-12 rounded-xl border-2 px-3"><button class="w-full h-12 rounded-xl bg-blue-600 text-white font-bold">Открыть</button><div id="error" class="text-red-600"></div></form><section id="work" class="hidden"><button id="exit" class="mb-4 font-bold text-blue-700">Закрыть доступ</button><div id="tickets" class="space-y-4"></div></section></main><script>(function(){var API = location.hostname === "gotopvpn.github.io" ? "https://topvpn.site/api/account/v1" : "/api/account/v1",K='topvpn_support_admin',t=sessionStorage.getItem(K)||'',box=document.getElementById('tickets');function e(v){var n=document.createElement('div');n.textContent=v||'';return n.innerHTML}async function q(p,o){o=o||{};o.headers=Object.assign({},o.headers||{},{Authorization:'Bearer '+t});var r=await fetch(API+p,o),j=await r.json().catch(function(){return{}});if(!r.ok)throw Error(j.error||'Ошибка');return j}function render(a){box.innerHTML=a.length?a.map(function(x){return '<article data-id="'+x.id+'" class="bg-white rounded-3xl p-6"><div class="flex justify-between"><div><div class="text-xs font-bold text-blue-600">№ '+x.id+' · '+e(x.displayName)+(x.email?' · '+e(x.email):'')+'</div><h2 class="text-xl font-extrabold">'+e(x.subject)+'</h2></div><select class="status border rounded-xl px-3"><option value="open" '+(x.status==='open'?'selected':'')+'>Открыто</option><option value="answered" '+(x.status==='answered'?'selected':'')+'>Отвечено</option><option value="closed" '+(x.status==='closed'?'selected':'')+'>Закрыто</option></select></div><div class="space-y-2 my-4">'+x.messages.map(function(m){return '<div class="rounded-2xl p-3 '+(m.author==='support'?'bg-blue-50 ml-6':'bg-slate-100 mr-6')+'"><b>'+(m.author==='support'?'Поддержка':'Пользователь')+'</b><div class="whitespace-pre-wrap">'+e(m.body)+'</div></div>'}).join('')+'</div><form class="reply flex gap-2"><input required maxlength="5000" class="flex-1 h-11 border-2 rounded-xl px-3" placeholder="Ответ"><button class="bg-blue-600 text-white font-bold rounded-xl px-5">Ответить</button></form></article>'}).join(''):'<div>Обращений нет.</div>';document.querySelectorAll('.reply').forEach(function(f){f.onsubmit=reply});document.querySelectorAll('.status').forEach(function(s){s.onchange=status})}async function load(){render((await q('/admin/support/tickets')).tickets)}async function reply(z){z.preventDefault();var a=z.target.closest('article'),i=z.target.querySelector('input');await q('/admin/support/tickets/'+a.dataset.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:i.value})});load()}async function status(z){var a=z.target.closest('article');await q('/admin/support/tickets/'+a.dataset.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:z.target.value})})}function show(){login.classList.add('hidden');work.classList.remove('hidden')}login.onsubmit=async function(z){z.preventDefault();t=key.value.trim();try{await load();sessionStorage.setItem(K,t);show()}catch(_){error.textContent='Ключ не подошёл'}};exit.onclick=function(){sessionStorage.removeItem(K);location.reload()};if(t){show();load().catch(function(){sessionStorage.removeItem(K);location.reload()})}})();</script></body></html>
