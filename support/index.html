<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Поддержка TopVPN</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-50 text-slate-900"><nav class="max-w-5xl mx-auto px-5 py-5 flex justify-between"><a href="/" class="text-2xl font-extrabold text-blue-600">TopVPN</a><div class="flex gap-4 font-semibold"><a href="/account/">Кабинет</a><a href="/">На главную</a></div></nav>
<main class="max-w-5xl mx-auto px-5 pb-16"><header class="rounded-[32px] bg-gradient-to-br from-sky-500 via-blue-600 to-blue-800 p-7 md:p-10 text-white mb-7"><div class="text-sm font-extrabold uppercase tracking-widest text-blue-100 mb-2">Поддержка</div><h1 class="text-3xl md:text-4xl font-extrabold mb-3">Поможем прямо на сайте</h1><p class="text-blue-50">Опишите проблему. Ответ появится здесь, даже если Telegram недоступен.</p></header>
<div class="grid lg:grid-cols-[360px_1fr] gap-6"><section class="bg-white rounded-3xl border p-6 h-fit"><h2 class="text-xl font-extrabold">Новое обращение</h2><p id="identity" class="text-sm text-slate-500 mb-5">Проверяем аккаунт…</p><form id="form" class="space-y-4"><div id="guest" class="hidden space-y-4"><label class="block text-sm font-bold">Ваше имя<input id="name" maxlength="80" class="mt-1 w-full h-12 rounded-xl border-2 px-3" placeholder="Как к вам обращаться"></label><label class="block text-sm font-bold">Электронная почта<input id="email" type="email" maxlength="254" class="mt-1 w-full h-12 rounded-xl border-2 px-3" placeholder="Для восстановления доступа"></label></div><label class="block text-sm font-bold">Тема<input id="subject" required minlength="3" maxlength="120" class="mt-1 w-full h-12 rounded-xl border-2 px-3" placeholder="Например: не подключается VPN"></label><label class="block text-sm font-bold">Что случилось<textarea id="message" required minlength="5" maxlength="5000" rows="6" class="mt-1 w-full rounded-xl border-2 p-3" placeholder="Устройство, приложение и текст ошибки"></textarea></label><div id="notice" class="hidden rounded-xl p-3 text-sm font-semibold"></div><button id="submit" class="w-full h-12 rounded-xl bg-blue-600 text-white font-extrabold disabled:opacity-50">Отправить</button></form></section>
<section><div class="flex justify-between mb-4"><h2 class="text-2xl font-extrabold">Ваши обращения</h2><button id="refresh" class="text-sm font-bold text-blue-700">Обновить</button></div><div id="tickets" class="space-y-4"><div class="rounded-3xl border bg-white p-6 text-slate-500">Обращений пока нет.</div></div></section></div></main>
<script>(function(){"use strict";var API = location.hostname === "gotopvpn.github.io" ? "https://topvpn.site/api/account/v1" : "/api/account/v1",AK="topvpn_account_token",GK="topvpn_support_tickets",at=localStorage.getItem(AK)||"",box=document.getElementById("tickets");function e(v){var n=document.createElement("div");n.textContent=v==null?"":String(v);return n.innerHTML}function d(v){return new Date(v*1000).toLocaleString("ru-RU",{dateStyle:"medium",timeStyle:"short"})}function refs(){try{return JSON.parse(localStorage.getItem(GK)||"[]")}catch(_){return[]}}function save(x){var a=refs().filter(function(y){return y.id!==x.id});a.unshift(x);localStorage.setItem(GK,JSON.stringify(a.slice(0,20)))}async function q(p,o){var r=await fetch(API+p,o||{}),j=await r.json().catch(function(){return{}});if(!r.ok){var x=new Error(j.message||"Не удалось выполнить запрос");x.status=r.status;throw x}return j}function render(a){if(!a.length){box.innerHTML='<div class="rounded-3xl border bg-white p-6 text-slate-500">Обращений пока нет.</div>';return}box.innerHTML=a.map(function(t){var m=t.messages.map(function(x){var u=x.author==='user';return '<div class="flex '+(u?'justify-end':'justify-start')+'"><div class="max-w-[88%] rounded-2xl px-4 py-3 '+(u?'bg-blue-600 text-white':'bg-slate-100')+'"><div class="text-xs font-bold opacity-70">'+(u?'Вы':'Поддержка')+' · '+d(x.createdAt)+'</div><div class="whitespace-pre-wrap break-words">'+e(x.body)+'</div></div></div>'}).join('');return '<article data-id="'+e(t.id)+'" class="rounded-3xl border bg-white p-5"><div class="flex justify-between gap-3 mb-4"><div><div class="text-xs font-bold text-blue-600">№ '+e(t.id)+'</div><h3 class="text-xl font-extrabold">'+e(t.subject)+'</h3></div><span class="h-fit rounded-full bg-slate-100 px-3 py-1 text-xs font-bold">'+(t.status==='answered'?'Есть ответ':t.status==='closed'?'Закрыто':'Ожидает ответа')+'</span></div><div class="space-y-3 mb-4">'+m+'</div>'+(t.status!=='closed'?'<form class="reply flex gap-2"><input required maxlength="5000" class="min-w-0 flex-1 h-11 rounded-xl border-2 px-3" placeholder="Написать сообщение"><button class="rounded-xl bg-slate-900 text-white px-4 font-bold">Отправить</button></form>':'')+'</article>'}).join('');document.querySelectorAll('.reply').forEach(function(f){f.addEventListener('submit',reply)})}async function load(){if(at){var j=await q('/support/tickets',{headers:{Authorization:'Bearer '+at}});render(j.tickets);return}var a=await Promise.all(refs().map(async function(x){try{return(await q('/support/tickets/'+x.id,{headers:{'X-Support-Token':x.token}})).ticket}catch(_){return null}}));render(a.filter(Boolean))}async function identify(){if(!at){document.getElementById('guest').classList.remove('hidden');document.getElementById('identity').textContent='Можно написать без аккаунта.';return load()}try{var j=await q('/account',{headers:{Authorization:'Bearer '+at}});document.getElementById('identity').textContent='Вы вошли как @'+j.account.username;load()}catch(_){at='';localStorage.removeItem(AK);document.getElementById('guest').classList.remove('hidden');document.getElementById('identity').textContent='Можно написать без аккаунта.';load()}}document.getElementById('form').addEventListener('submit',async function(x){x.preventDefault();var b=document.getElementById('submit'),n=document.getElementById('notice'),p={subject:subject.value.trim(),message:message.value.trim()};if(!at){p.displayName=name.value.trim();p.email=email.value.trim()}b.disabled=true;try{var h={'Content-Type':'application/json'};if(at)h.Authorization='Bearer '+at;var j=await q('/support/tickets',{method:'POST',headers:h,body:JSON.stringify(p)});if(j.accessToken)save({id:j.ticket.id,token:j.accessToken});x.target.reset();n.textContent='Обращение создано. Ответ появится здесь.';n.className='rounded-xl p-3 text-sm font-semibold bg-green-50 text-green-700';await load()}catch(z){n.textContent=z.message;n.className='rounded-xl p-3 text-sm font-semibold bg-red-50 text-red-700'}finally{b.disabled=false}});async function reply(x){x.preventDefault();var a=x.target.closest('article'),i=x.target.querySelector('input'),r=refs().find(function(y){return y.id===a.dataset.id}),h={'Content-Type':'application/json'};if(at)h.Authorization='Bearer '+at;else h['X-Support-Token']=r.token;try{await q('/support/tickets/'+a.dataset.id+'/messages',{method:'POST',headers:h,body:JSON.stringify({message:i.value.trim()})});await load()}catch(z){alert(z.message)}}document.getElementById('refresh').onclick=load;identify()}());</script></body></html>
